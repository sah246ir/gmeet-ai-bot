<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>WebSocket PCM Stream Logger & Player</title>
    <style>
        body { font-family: sans-serif; margin: 40px; background: #f4f4f9; color: #333; }
        .container { background: white; padding: 30px; border-radius: 8px; box-shadow: 0 4px 6px rgba(0,0,0,0.1); max-width: 500px; }
        button { background: #28a745; color: white; border: none; padding: 12px 20px; font-size: 16px; border-radius: 4px; cursor: pointer; width: 100%; font-weight: bold; margin-bottom: 15px;}
        button:hover { background: #218838; }
        button:disabled { background: #cccccc; cursor: not-allowed; }
        .status-box { background: #eee; padding: 10px; border-radius: 4px; font-size: 14px; margin-top: 10px; }
        .counter { font-weight: bold; color: #007bff; }
        .live { color: #28a745; font-weight: bold; }
    </style>
</head>
<body>

<div class="container">
    <h2>🎙️ Audio Stream Logger & Player</h2>
    <p>The page automatically connects to the WebSocket and caches chunks into memory.</p>
    
    <div class="status-box">
        <p>WS Status: <span id="wsStatus">Connecting...</span></p>
        <p>Logged Chunks: <span id="chunkCount" class="counter">0</span></p>
    </div>
    <br>
    
    <button id="playBtn" disabled>▶ Play Logged Stream</button>
    <p id="playbackStatus">Audio Engine: Idle</p>
</div>

<script>
    const playBtn = document.getElementById('playBtn');
    const wsStatusText = document.getElementById('wsStatus');
    const chunkCountText = document.getElementById('chunkCount');
    const playbackStatusText = document.getElementById('playbackStatus');
    
    // Global array memory to store your incoming base64 chunks
    let chunkLog = []; 
    let audioCtx = null;
    let nextStartTime = 0;

    // 1. Automatically connect to your local Node.js WebSocket Server on page load
    // CHANGE THIS URL to match your real WebSocket port if it isn't 8080!
    const ws = new WebSocket('ws://localhost:3000'); 

    ws.onopen = () => {
        wsStatusText.innerText = "🟢 Connected! Logging stream...";
        wsStatusText.className = "live";
    };

    ws.onmessage = (event) => {
        try {
            let payload = event.data;
            
            // Handle both raw string data and auto-parsed object structures safely
            if (typeof event.data === "string") {
                payload = JSON.parse(event.data);
            } else {
                payload = event.data;
            }
            
            // Extract the base64 string from the "data" key and save it
            if (payload && payload.data) {
                chunkLog.push(payload.data);
                chunkCountText.innerText = chunkLog.length;
                
                // Enable the play button as soon as we have at least one logged chunk
                if (chunkLog.length > 0) {
                    playBtn.disabled = false;
                }
            }
        } catch (err) {
            console.error("Failed to read incoming WS packet:", err);
        }
    };

    ws.onerror = (err) => {
        wsStatusText.innerText = "❌ Connection Error";
        wsStatusText.className = "";
        console.error(err);
    };

    ws.onclose = () => {
        wsStatusText.innerText = "🔴 Connection Closed";
        wsStatusText.className = "";
    };

    // 2. Play the accumulated logs when tapping the button
    playBtn.addEventListener('click', async () => {
        if (chunkLog.length === 0) return;
        
        playbackStatusText.innerText = "Initializing Audio Hardware...";
        
        // Setup modern audio pipeline at 16kHz (matching your FFmpeg configuration)
        const AudioContext = window.AudioContext || window.webkitAudioContext;
        audioCtx = new AudioContext({ sampleRate: 16000 });
        nextStartTime = audioCtx.currentTime;

        playbackStatusText.innerText = `🔊 Playing ${chunkLog.length} cached chunks back-to-back...`;

        // Loop through the collected log array sequentially
        for (let i = 0; i < chunkLog.length; i++) {
            playRawBase64Chunk(chunkLog[i]);
        }
    });

    function playRawBase64Chunk(base64String) {
        if (!audioCtx) return;

        // Convert base64 characters back into a raw binary format
        const binaryString = atob(base64String);
        const len = binaryString.length;
        
        // Map data directly into a 16-bit integer array view (matching FFmpeg's s16le)
        const buffer = new ArrayBuffer(len);
        const view = new DataView(buffer);
        for (let i = 0; i < len; i++) {
            view.setUint8(i, binaryString.charCodeAt(i));
        }

        const numSamples = len / 2; // 16-bit audio = 2 bytes per sample
        const int16Array = new Int16Array(buffer);

        // Build a blank hardware output block slot (1 Channel, 16000Hz)
        const audioBuffer = audioCtx.createBuffer(1, numSamples, 16000);
        const channelData = audioBuffer.getChannelData(0);

        // Convert raw integers (-32768 to 32767) into Web Audio floating points (-1.0 to 1.0)
        for (let i = 0; i < numSamples; i++) {
            channelData[i] = int16Array[i] / 32768.0;
        }

        // Attach node to audio output destination
        const source = audioCtx.createBufferSource();
        source.buffer = audioBuffer;
        source.connect(audioCtx.destination);
        
        // Seamlessly schedule the sound packets back-to-back with no delay gaps
        if (nextStartTime < audioCtx.currentTime) {
            nextStartTime = audioCtx.currentTime; 
        }
        
        source.start(nextStartTime);
        nextStartTime += audioBuffer.duration;
    }
</script>

</body>
</html>
